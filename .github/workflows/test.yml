name: MorphTree 2.0.0 - zero-fit qualification

on:
  workflow_dispatch:
    inputs:
      confirm_zero_fit_scope:
        description: 'Authorize four serial scoped zero-fit jobs; no model training or publication'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: morphtree-2-0-0-qualification
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  SOURCE_DATE_EPOCH: '1792022400'
  PIP_NO_INPUT: '1'

jobs:
  scoped-zero-fit:
    if: ${{ inputs.confirm_zero_fit_scope }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify committed source inventory
        run: python -I -B tools/check_repository.py --git-head --expected-commit '${{ github.sha }}'
      - name: Install local build tools
        run: python -m pip --isolated --disable-pip-version-check install --no-cache-dir build==1.3.0 hatchling==1.27.0
      - name: Build release distributions
        run: python -I -B -m build
      - name: Validate wheel and sdist in clean installations
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          dist = root / 'dist'
          wheel = dist / 'morphtree-2.0.0-py3-none-any.whl'
          source = dist / 'morphtree-2.0.0.tar.gz'
          assert sorted(p.name for p in dist.iterdir()) == sorted([wheel.name, source.name])
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          def run(*args):
              subprocess.run(list(map(str, args)), check=True, timeout=300, cwd=os.environ['RUNNER_TEMP'])
          for kind, artifact in [('wheel', wheel), ('sdist', source)]:
              environment = pathlib.Path(os.environ['RUNNER_TEMP']) / ('morphtree-' + kind)
              assert not environment.exists()
              run(sys.executable, '-I', '-B', '-m', 'venv', environment)
              interpreter = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              run(interpreter, '-I', '-B', '-m', 'pip', '--isolated', '--disable-pip-version-check', 'install', '--no-cache-dir', artifact)
              run(interpreter, '-I', '-B', '-m', 'pip', '--isolated', '--disable-pip-version-check', 'check')
              receipt = environment.parent / ('morphtree-installed-' + kind + '.json')
              run(interpreter, '-I', '-B', root / 'tools/installed_candidate_check.py', '--wheel', wheel, '--sha256', digest, '--version', '2.0.0', '--out', receipt)
              run(interpreter, '-I', '-B', '-m', 'unittest', 'discover', '-s', root / 'tests/product', '-v')
              print(receipt.read_text('utf8'))
