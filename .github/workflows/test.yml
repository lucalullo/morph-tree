name: MorphTree native candidate - manual zero-fit build
on:
  workflow_dispatch:
    inputs:
      confirm_zero_fit_scope:
        description: Build and test six installed profiles without training or publication
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: morphtree-native-qualification
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  SOURCE_DATE_EPOCH: '1792022400'
  PIP_NO_INPUT: '1'
jobs:
  scoped-zero-fit:
    if: ${{ inputs.confirm_zero_fit_scope }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify reviewed sources
        run: python -I -B tools/check_repository.py
      - name: Install isolated build tools
        run: python -m pip --isolated install build==1.3.0 hatchling==1.27.0
      - name: Install Linux audit tools in the CI environment
        if: runner.os == 'Linux'
        run: python -m pip --isolated install auditwheel==6.8.2 pyelftools==0.33 packaging==26.3 patchelf==0.19.1.0
      - name: Build in separate source copy
        if: runner.os == 'Windows'
        run: python -I -B tools/build_artifacts.py
      - name: Build and audit Linux wheel without changing native payload
        if: runner.os == 'Linux'
        run: python -I -B tools/build_artifacts.py --manylinux
      - name: Check wheel and sdist installations
        shell: python
        run: |
          import os,pathlib,subprocess,sys
          root=pathlib.Path.cwd()
          for artifact in sorted((root/'dist').iterdir()):
              kind='wheel' if artifact.suffix=='.whl' else 'sdist'
              prefix=pathlib.Path(os.environ['RUNNER_TEMP'])/('morphtree-'+kind)
              assert not prefix.exists()
              def run(args):
                  subprocess.run(list(map(str,args)),check=True,timeout=240,cwd=os.environ['RUNNER_TEMP'])
              run([sys.executable,'-I','-B','-m','venv',prefix])
              py=prefix/('Scripts/python.exe' if os.name=='nt' else 'bin/python')
              run([py,'-I','-B','-m','pip','--isolated','install',artifact])
              run([py,'-I','-B','-m','pip','check'])
              run([py,'-I','-B',root/'tools/check_installed.py'])
      - name: Preserve verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morphtree-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
