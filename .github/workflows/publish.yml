name: MorphTree publication - owner approval required
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Explicitly approved version; RC only on TestPyPI, final version on PyPI
        required: true
        type: string
      target:
        required: true
        type: choice
        options: [testpypi, pypi]
      reviewed_build_run:
        description: Successful build run from the reviewed final commit
        required: true
        type: string
      windows_artifact:
        required: true
        type: string
        default: morphtree-windows-latest-3.12
      linux_artifact:
        required: true
        type: string
        default: morphtree-ubuntu-24.04-3.12
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -I -B tools/check_repository.py
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.windows_artifact }}
          run-id: ${{ inputs.reviewed_build_run }}
          github-token: ${{ github.token }}
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.linux_artifact }}
          run-id: ${{ inputs.reviewed_build_run }}
          github-token: ${{ github.token }}
          path: dist/linux
      - name: Install upload frontend
        run: python -m pip --isolated install twine==6.2.0
      - name: Enforce version, qualification and reviewed artifact hashes
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.MORPHTREE_PUBLICATION_TOKEN }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          TARGET_REPOSITORY: ${{ inputs.target }}
        shell: python
        run: |
          import os,subprocess,sys
          subprocess.run([sys.executable,'-I','-B','tools/publish_reviewed.py',
                          '--target',os.environ['TARGET_REPOSITORY'],
                          '--expected-version',os.environ['EXPECTED_VERSION']],check=True)
