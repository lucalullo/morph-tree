name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  SOURCE_DATE_EPOCH: "1792022400"
  PIP_NO_INPUT: "1"

jobs:
  tests:
    name: Build and zero-fit tests - ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact source inventory
        run: python -I -B tools/check_repository.py
      - name: Install build and test tools
        run: python -m pip --isolated install build==1.3.0 hatchling==1.27.0 twine==6.2.0 PyYAML==6.0.3
      - name: Test release tooling without publication
        run: python -I -B -m unittest discover -s tools/tests -v
      - name: Install Linux wheel auditing dependencies
        if: runner.os == 'Linux'
        run: python -m pip --isolated install auditwheel==6.8.2 pyelftools==0.33 packaging==26.3 patchelf==0.19.1.0
      - name: Build verified Windows wheel and sdist
        if: runner.os == 'Windows'
        run: python -I -B tools/build_artifacts.py
      - name: Build and audit Linux wheel and sdist
        if: runner.os == 'Linux'
        run: python -I -B tools/build_artifacts.py --manylinux
      - name: Verify wheel and sdist contain the current README
        shell: python
        run: |
          import email.policy, tarfile, tomllib, zipfile
          from email.parser import BytesParser
          from pathlib import Path

          def normalized(data):
              return data.replace(b"\r\n", b"\n")

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          readme_bytes = Path("README.md").read_bytes()
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise RuntimeError("Expected exactly one wheel and one sdist")

          with zipfile.ZipFile(wheels[0]) as archive:
              names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(names) != 1:
                  raise RuntimeError("Expected exactly one wheel METADATA")
              wheel_metadata = archive.read(names[0])

          with tarfile.open(sdists[0], "r:gz") as archive:
              prefix = f"{project['name']}-{project['version']}/"
              info = archive.extractfile(prefix + "PKG-INFO")
              source_readme = archive.extractfile(prefix + "README.md")
              if info is None or source_readme is None or source_readme.read() != readme_bytes:
                  raise RuntimeError("Sdist README differs from source README")
              sdist_metadata = info.read()

          for label, raw in (("wheel", wheel_metadata), ("sdist", sdist_metadata)):
              metadata = BytesParser(policy=email.policy.compat32).parsebytes(raw)
              if metadata.get("Name") != project["name"] or metadata.get("Version") != project["version"]:
                  raise RuntimeError(f"{label}: distribution name/version mismatch")
              if metadata.get("Description-Content-Type", "").split(";", 1)[0].strip().lower() != "text/markdown":
                  raise RuntimeError(f"{label}: Markdown description required")
              if normalized(metadata.get_payload(decode=True) or b"") != normalized(readme_bytes):
                  raise RuntimeError(f"{label}: package description differs from current README")
              print(f"PASS: {label} metadata matches current README")
      - name: Verify distributions with Twine
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          artifacts = sorted(Path('dist').glob('*.whl')) + sorted(Path('dist').glob('*.tar.gz'))
          if len(artifacts) != 2:
              raise RuntimeError('Expected one wheel and one sdist')
          subprocess.run([sys.executable, '-I', '-B', '-m', 'twine', 'check', '--strict', *map(str, artifacts)], check=True)
      - name: Install and test wheel and sdist in isolated environments (zero fit)
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          for artifact in sorted((root / 'dist').iterdir()):
              kind = 'wheel' if artifact.suffix == '.whl' else 'sdist'
              prefix = pathlib.Path(os.environ['RUNNER_TEMP']) / ('morphtree-ci-' + kind)
              if prefix.exists():
                  raise RuntimeError('Environment already exists: ' + str(prefix))
              def run(args):
                  subprocess.run(list(map(str, args)), check=True, timeout=240, cwd=os.environ['RUNNER_TEMP'])
              run([sys.executable, '-I', '-B', '-m', 'venv', prefix])
              python = prefix / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              run([python, '-I', '-B', '-m', 'pip', '--isolated', 'install', artifact])
              run([python, '-I', '-B', '-m', 'pip', 'check'])
              run([python, '-I', '-B', root / 'tools/check_installed.py'])
      - name: Recheck source inventory
        run: python -I -B tools/check_repository.py
